name: Deploy to server

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH & pull
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 3.27.76.114
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: bash /home/ubuntu/deploy-convert.sh
